name: Import pinned Gowon source

on:
  push:
    branches:
      - gowon-port
    paths:
      - .github/workflows/gowon-import.yml

permissions:
  contents: write

concurrency:
  group: gowon-source-import
  cancel-in-progress: false

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Melo migration branch
        uses: actions/checkout@v4
        with:
          ref: gowon-port
          fetch-depth: 0

      - name: Import exact Gowon source snapshot
        shell: bash
        env:
          UPSTREAM_SHA: 256e728ab446dbfe942915acb94e494a4b6d37b0
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/gowon-source"
          curl --fail --location --silent --show-error \
            "https://github.com/gowon-bot/gowon/archive/${UPSTREAM_SHA}.tar.gz" \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/gowon-source"

          # Preserve Melo's migration notes and this narrowly-triggered importer.
          cp MIGRATION_STATUS.md "$RUNNER_TEMP/MIGRATION_STATUS.md"
          cp .github/workflows/gowon-import.yml "$RUNNER_TEMP/gowon-import.yml"

          # Replace tracked project contents on this branch only. The main branch
          # remains untouched, and the importer's own workflow is retained.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/gowon-source/." .
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/gowon-import.yml" .github/workflows/gowon-import.yml
          cp "$RUNNER_TEMP/MIGRATION_STATUS.md" MIGRATION_STATUS.md

          # Do not import upstream deployment workflows: GitHub restricts
          # workflow-file writes for the repository token, and those workflows
          # may assume Gowon-specific secrets or deployment infrastructure.
          find .github/workflows -type f ! -name 'gowon-import.yml' -delete

          git add --all
          if git diff --cached --quiet; then
            echo "Pinned upstream source already matches this branch."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: import Gowon source baseline"
          git push origin HEAD:gowon-port
